<!DOCTYPE html>

    <head>
        <meta charset="utf-8">
        <title>Reservoirs</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4" defer></script>
        <script src="app.js" defer></script>
        <style>
            /* Chart.js sizes the chart to fit its parent, so this sets the chart size */
            .chart-container {
                position: relative;
                width: 50%;
            }
        </style>
    </head>

    <body>
        <h2>Reservoirs</h2>
        <p>Sample data, not live readings. Credit to United Utilites as the source.</p>    
        <h3>United Utilities</h3>
        <p id="week-date"></p>
        <table>
            <thead>
                <th>Reservoir</th><th>This week actual stock</th>
            </thead>
            <tbody id="reservoir-rows"></tbody>
        </table>
        <div class="chart-container">
            <canvas id="reservoir-chart"></canvas>
        </div>
    </body>
