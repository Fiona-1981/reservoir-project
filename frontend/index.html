<!DOCTYPE html>

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Reservoirs</title>
        <link rel="stylesheet" href="styles.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4" defer></script>
        <script src="app.js" defer></script>
    </head>

    <body>
        <h2>Reservoirs</h2>
        <p>Data: United Utilities, updated weekly from the <a href="https://www.unitedutilities.com/help-and-support/your-water-supply/your-reservoirs/reservoir-levels/">reservoir levels page.</a></p>    
        <h3>United Utilities</h3>
        <p id="week-date"></p>
        <table>
            <thead>
                <th>Reservoir</th><th>This week actual stock</th>
            </thead>
            <tbody id="reservoir-rows"></tbody>
        </table>
        <div class="chart-container">
            <canvas id="reservoir-chart"></canvas>
        </div>
        <footer>
            <p><a href="https://github.com/Fiona-1981/reservoir-project">View the code on GitHub</a></p>
        </footer>
    </body>
